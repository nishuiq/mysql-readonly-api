# All omitted options use the defaults documented in README.md.
server:
  host: 127.0.0.1
  port: 8765

query:
  default_limit: 500
  max_limit: 5000
  timeout_ms: 15000

profiles:
  example-dev:
    enabled: false # Fill in credentials, then enable.
    description: Example development database
    mysql:
      host: localhost
      port: 3306
      username: readonly
      password: "replace-me"
      use_ssl: true
      # ssl_ca: "C:/certificates/mysql-ca.pem"
      # For a deliberately unencrypted local connection, set use_ssl: false.
      server_timezone: "+08:00"

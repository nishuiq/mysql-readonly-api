[project]
name = "mysql-readonly-api"
version = "0.1.0"
description = "A tiny readonly MySQL REST API."
readme = { file = "README.adoc", content-type = "text/plain" }
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.115.0",
    "pymysql[rsa]>=1.1.1",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.6",
]

[tool.uv.extra-build-variables]
# 缺少匹配的 wheel 时构建纯 Python 版本，配置读取不依赖 LibYAML 扩展
pyyaml = { PYYAML_FORCE_LIBYAML = "0" }

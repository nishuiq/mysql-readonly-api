[project]
name = "mysql-readonly-api"
version = "0.1.0"
description = "A tiny readonly MySQL REST API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "pymysql[rsa]>=1.1.1",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ruff>=0.16.6",
]

